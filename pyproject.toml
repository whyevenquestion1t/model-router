[project]
name = "model-router"
version = "0.1.0"
description = "A LangChain agent middleware that routes tasks to the cheapest model tier that can handle them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rinchin Shoysoronov" }]
keywords = ["langchain", "langgraph", "llm", "agents", "model-routing", "middleware"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.urls]
Homepage = "https://github.com/whyevenquestion1t/model-router"
Issues = "https://github.com/whyevenquestion1t/model-router/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
